name: CO Tanker Intelligence - Check sources and deploy
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/data/**'
      - 'docs/data/**/*'
  workflow_dispatch:
  schedule:
    - cron: '17 */3 * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: co-tanker-watch-pages
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: agent/requirements.txt
      - name: Install parser dependencies
        run: python -m pip install -r agent/requirements.txt
      - name: Verify collector tests
        run: python -m unittest discover -s agent -p 'test_*.py'
      - name: Collect official, industry, editorial and public video listings
        run: python agent/collector.py --output docs/data/intelligence.json
      - name: Discover additional maritime publishers for manual review
        run: python agent/source_discovery.py
      - name: Save source status and feed history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/intelligence.json docs/data/source_candidates.json
          if ! git diff --cached --quiet; then
            # Preserve generated snapshots while updating to the latest code.
            # No rebase of JSON snapshots: concurrent writes otherwise conflict.
            cp docs/data/intelligence.json /tmp/co-intelligence-feed.json
            cp docs/data/source_candidates.json /tmp/co-source-candidates.json
            for attempt in 1 2 3; do
              git fetch origin main
              git reset --hard origin/main
              cp /tmp/co-intelligence-feed.json docs/data/intelligence.json
              cp /tmp/co-source-candidates.json docs/data/source_candidates.json
              git add docs/data/intelligence.json docs/data/source_candidates.json
              if git diff --cached --quiet; then break; fi
              git commit -m "chore: refresh maritime intelligence and source candidates"
              if git push origin HEAD:main; then break; fi
              if [ "$attempt" -eq 3 ]; then exit 1; fi
              sleep 3
            done
          fi
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Build Sea Glass dashboard for Pages
        run: python agent/build_web.py
      - name: Verify shipped Watch interface
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('docs/index.html').read_text(encoding='utf-8')
          assert "provenanceLabel(e)" in s, "Published bundle missing provenance labels"
          assert "watchUseGithub" in s, "Published bundle missing feed reset"
          assert 'const localFile=true;' not in s, "Published bundle still in file:// mode"
          print("Verified current Watch in published HTML")
          PY
      - name: Package PWA website
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs
      - name: Publish PWA
        id: deployment
        uses: actions/deploy-pages@v4
