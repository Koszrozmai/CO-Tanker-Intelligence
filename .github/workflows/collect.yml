name: CO Tanker Intelligence - Check sources and deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 */3 * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: co-tanker-watch-pages
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: agent/requirements.txt
      - name: Install parser dependencies
        run: python -m pip install -r agent/requirements.txt
      - name: Verify collector tests
        run: python -m unittest discover -s agent -p 'test_*.py'
      - name: Collect official public maritime source listings
        run: python agent/collector.py --output docs/data/intelligence.json
      - name: Save source status and feed history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/intelligence.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh public maritime source feed"
            git push
          fi
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Package PWA website
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs
      - name: Publish PWA
        id: deployment
        uses: actions/deploy-pages@v4
